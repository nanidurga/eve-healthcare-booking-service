services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve_diagnostics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this, so migrations never race an unready database.
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_diagnostics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://eve:eve@db:5432/eve_diagnostics
      JWT_SECRET: change-me-in-production-this-is-only-for-local-docker
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      PAYMENT_FAILURE_CENTS: 13
      SEED_ON_START: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
